[project]
name = "gpupool-node"
version = "0.0.0"
description = "gpupool node agent (SPEC §4): node key, registration link, heartbeat, Arkiv listing"
requires-python = ">=3.12,<3.13"
dependencies = ["eth-account>=0.13,<0.14", "httpx>=0.27,<0.29"]

[project.scripts]
gpupool-node = "gpupool_node.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpupool_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
