[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Hedera EVM supports Shanghai opcodes (PUSH0). Pinned so a newer solc default does not emit unsupported opcodes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# The cross-language Merkle vector is read with vm.readFile.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
hedera_testnet = "${HEDERA_JSON_RPC_URL}"
